<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Modern Geometric Spider / Flow Cyber Icon -->
  <g transform="translate(32, 32)" filter="url(#redGlow)" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Core / Hex Body -->
    <polygon points="0,-7 6,-3 6,5 0,9 -6,5 -6,-3" fill="#f43f5e" fill-opacity="0.25" stroke="#fb7185" stroke-width="2"/>
    <circle cx="0" cy="1" r="2" fill="#fb7185"/>
    
    <!-- Top Mandibles / Antennas -->
    <path d="M-2,-7 L-4,-14 L-8,-16"/>
    <path d="M2,-7 L4,-14 L8,-16"/>
    
    <!-- Legs Left -->
    <path d="M-6,-3 L-14,-8 L-22,-4"/>
    <path d="M-6,1 L-16,1 L-22,7"/>
    <path d="M-5,5 L-14,11 L-18,19"/>
    
    <!-- Legs Right -->
    <path d="M6,-3 L14,-8 L22,-4"/>
    <path d="M6,1 L16,1 L22,7"/>
    <path d="M5,5 L14,11 L18,19"/>
  </g>
</svg>